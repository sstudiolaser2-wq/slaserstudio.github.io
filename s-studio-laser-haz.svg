<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" fill="none">
 <defs>
  <linearGradient id="beam" x1="320" y1="190" x2="870" y2="790" gradientUnits="userSpaceOnUse"><stop stop-color="#F5FFFF"/><stop offset=".35" stop-color="#00F5FF"/><stop offset=".73" stop-color="#36D8FF"/><stop offset="1" stop-color="#BA55FF"/></linearGradient>
  <filter id="bloom" x="175" y="72" width="850" height="765" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="18" result="wide"/><feMerge><feMergeNode in="wide"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="coreGlow" x="200" y="100" width="800" height="700" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4" result="small"/><feMerge><feMergeNode in="small"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <rect width="1200" height="960" fill="#030609"/>
 <!-- One uninterrupted laser trail draws the brand's S -->
 <path d="M817 202H474C379 202 320 254 320 331C320 395 368 431 454 455L736 534C822 558 870 594 870 658C870 735 811 787 716 787H357" stroke="url(#beam)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".95" filter="url(#bloom)"/>
