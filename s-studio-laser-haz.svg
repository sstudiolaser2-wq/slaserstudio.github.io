 <!-- Laser emitter and beam flare -->
 <path d="M844 178L827 195L844 212L861 195L844 178Z" fill="#08151A" stroke="#72F7FF" stroke-width="2"/>
 <circle cx="844" cy="195" r="4" fill="#F4FFFF"/>
