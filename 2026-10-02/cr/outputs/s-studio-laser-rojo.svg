<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" fill="none">
 <defs>
  <linearGradient id="red" x1="365" y1="145" x2="820" y2="495" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF2F2"/><stop offset=".17" stop-color="#FF3138"/><stop offset=".64" stop-color="#FF002E"/><stop offset="1" stop-color="#FF6A35"/></linearGradient>
  <linearGradient id="silver" x1="405" y1="145" x2="805" y2="495" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".2" stop-color="#8F9BA5"/><stop offset=".38" stop-color="#F5FAFC"/><stop offset=".58" stop-color="#76828D"/><stop offset=".78" stop-color="#E4EBF0"/><stop offset="1" stop-color="#AAB4BC"/></linearGradient>
  <filter id="redglow" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="17" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="core" x="-20%" y="-25%" width="140%" height="150%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
