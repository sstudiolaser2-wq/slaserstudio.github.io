 <path d="M810 160H493L405 240L466 300L739 344L805 409L728 485H415" stroke="#FF002E" stroke-width="70" stroke-linecap="square" stroke-linejoin="bevel" opacity=".82" filter="url(#redglow)"/>
 <path d="M810 160H493L405 240L466 300L739 344L805 409L728 485H415" stroke="url(#silver)" stroke-width="52" stroke-linecap="square" stroke-linejoin="bevel"/>
 <path d="M810 160H493L405 240L466 300L739 344L805 409L728 485H415" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square" stroke-linejoin="bevel" filter="url(#core)"/>
